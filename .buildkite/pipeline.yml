# Check out with a blobless partial clone: all commits and trees are fetched up front, while
# file contents are downloaded on demand. This repository carries ~965 MB of history, nearly
# all of it historical blobs that no job reads, and every job checks out independently.
#
# Full history is deliberately preserved rather than using a `--depth` shallow clone, which
# would break `tools/oss-check` (`git merge-base origin/main`, then `git worktree add --detach`
# on that merge base) and Danger's PR diff.
env:
  BUILDKITE_GIT_CLONE_FLAGS: "-v --filter=blob:none"

steps:
  - label: "Bazel"
    commands:
      - echo "+++ Build"
      - bazel build :swiftlint
      - echo "+++ Test"
      - make bazel_test
  - label: "SwiftPM"
    commands:
      - echo "+++ Generate Template Rule"
      - swift run swiftlint-dev rules template FooBarBaz --rewriter --id foo_bar --config --kind metrics --severity error --test
      - echo "+++ Test"
      - make spm_test
    env:
      SKIP_INTEGRATION_TESTS: true
  - label: "Danger"
    commands:
      - echo "+++ Run OSS Scan"
      - make oss_scan
    artifact_paths: "oss-check-summary.md"
    priority: 10
  - label: "TSan Tests"
    commands:
      - echo "+++ Test"
      - make bazel_test_tsan
  - label: "Registration"
    commands:
      - echo "+++ Register Rules and Reporters"
      - make --always-make bazel_register
      - echo "+++ Diff Files"
      - git diff --quiet HEAD
