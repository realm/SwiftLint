# GitHub-hosted runners that actionlint does not know about yet. Remove once an
# actionlint release lists them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
paths:
  .github/workflows/docker.yml:
    ignore:
      - 'shellcheck reported issue in this script: SC2046:warning:1:137: Quote this to prevent word splitting'
